# Orchestrator stack. MySQL lives in docker-compose.mysql.yaml; start both with
#   docker compose -f docker-compose.yaml -f docker-compose.mysql.yaml up -d --build --scale runner=2
# Settings come from .env (copy .env.example). The hub port is the only one runner hosts need to reach.

# An existing MySQL server: set DB_* in .env. docker-compose.mysql.yaml replaces these with its
# own server and the MYSQL_* credentials.
x-db-env: &db-env
  DB_HOST: ${DB_HOST:-mysql}
  DB_PORT: ${DB_PORT:-3306}
  DB_NAME: ${DB_NAME:-orchestrator}
  DB_USER: ${DB_USER:-orchestrator}
  DB_PASSWORD: ${DB_PASSWORD:-orchestrator}

# The hub's /connect routing and the Grid UI's 'failing' state read the same values: a slot with this
# many consecutive connect failures is skipped and retried once per cooldown. The hub renews its lease
# every third of GATEWAY_HUB_LEASE_S; the UI flags a hub session as stale once its hub's lease ran out.
x-slot-env: &slot-env
  SLOT_FAIL_THRESHOLD: ${SLOT_FAIL_THRESHOLD:-3}
  SLOT_FAIL_COOLDOWN_S: ${SLOT_FAIL_COOLDOWN_S:-300}
  GATEWAY_HUB_LEASE_S: ${GATEWAY_HUB_LEASE_S:-90}

services:
  hub:
    container_name: playwright_hub
    image: playwright_orchestrator_hub
    build:
      context: .
      dockerfile: docker/hub/Dockerfile
    restart: unless-stopped
    networks:
      - playwright
    ports:
      - "${GATEWAY_PORT:-4500}:4500"
    environment:
      <<: [*db-env, *slot-env]
      HUB_DB: ${HUB_DB:-mysql}
      EPHEMERAL_GRACE_S: ${EPHEMERAL_GRACE_S:-120}
      # /connect: how long a client waits for a free slot, how many may wait, how many slots one is tried on.
      GATEWAY_QUEUE_TIMEOUT_S: ${GATEWAY_QUEUE_TIMEOUT_S:-60}
      GATEWAY_QUEUE_MAX: ${GATEWAY_QUEUE_MAX:-200}
      GATEWAY_CONNECT_ATTEMPTS: ${GATEWAY_CONNECT_ATTEMPTS:-3}
      # Bootstrap tokens: the runners and the example check below use them, and they work while MySQL
      # is down. The hub also accepts the managed tokens made on the Grid UI's Access page.
      GATEWAY_AGENT_TOKEN: ${GATEWAY_AGENT_TOKEN:?set GATEWAY_AGENT_TOKEN in .env (see .env.example)}
      GATEWAY_CLIENT_TOKEN: ${GATEWAY_CLIENT_TOKEN:?set GATEWAY_CLIENT_TOKEN in .env (see .env.example)}
      TOKEN_CACHE_S: ${TOKEN_CACHE_S:-10}
      TOKEN_RECHECK_S: ${TOKEN_RECHECK_S:-15}
    # Polls faster than the image's own check so runners start soon after the hub; start_period
    # covers the hub waiting for MySQL on first boot.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4500/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 120s

  # Linux runner nodes. No container_name and no ports, so `--scale runner=N` works; each one
  # registers with the hub under its container hostname as an ephemeral node (EPHEMERAL=1 in the
  # image), so the hub removes a runner EPHEMERAL_GRACE_S after it goes away.
  runner:
    image: playwright_orchestrator_runner
    build:
      context: .
      dockerfile: docker/runner/Dockerfile
    restart: unless-stopped
    init: true
    shm_size: 1gb
    networks:
      - playwright
    environment:
      HUB_URL: ws://hub:4500
      GATEWAY_AGENT_TOKEN: ${GATEWAY_AGENT_TOKEN:?set GATEWAY_AGENT_TOKEN in .env (see .env.example)}
      SLOTS: ${RUNNER_SLOTS:-4}
    depends_on:
      hub:
        condition: service_healthy

  web:
    container_name: python_playwright
    image: playwright_orchestrator_web
    build:
      context: .
      dockerfile: docker/python/Dockerfile
    networks:
      - playwright

  example_playwright:
    #user: "1032:1034" #userid of the playwright user
    container_name: example_playwright
    image: playwright_orchestrator_web
    # Built by the web service; without this a first `up` tries to pull it from Docker Hub.
    pull_policy: never
    restart: unless-stopped
    init: true
    networks:
      - playwright
    # The check connects to <GATEWAY_URL>/connect; the hub picks the slot (on GATEWAY_NODE if it is set).
    # MySQL is only used to create the tables, sync hosts: and free stale claims.
    environment:
      <<: *db-env
      GATEWAY_URL: ${GATEWAY_URL:-ws://hub:4500}
      GATEWAY_CLIENT_TOKEN: ${GATEWAY_CLIENT_TOKEN:?set GATEWAY_CLIENT_TOKEN in .env (see .env.example)}
      GATEWAY_NODE: ${GATEWAY_NODE:-}
    volumes:
      - ./logs/example_playwright/:/app/logs/
      - ./src/:/app/src
      - ./main.py:/app/main.py
      - ./full/example/example.py:/app/example.py
    command: python3 /app/main.py --fil example.py --fol /app/ -i 100
    depends_on:
      hub:
        condition: service_started

  grid_ui:
    container_name: playwright_grid_ui
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    restart: unless-stopped
    networks:
      - playwright
    ports:
      - "127.0.0.1:4444:4444"
    environment:
      <<: [*db-env, *slot-env]
      ORCHESTRATOR_CONFIG: /app/src/database.yaml
      GATEWAY_URL: ${GATEWAY_URL:-ws://hub:4500}
      # Needed for management actions when the UI is exposed, and for the Access, MFA and Admin pages, unless
      # single sign-on is set up; with single sign-on, a break-glass sign-in with every permission. Optional:
      # without it (or single sign-on) the rest of the UI works, and those pages stay locked.
      GRID_ADMIN_TOKEN: ${GRID_ADMIN_TOKEN:-}
      GRID_UI_ALLOWED_HOSTS: ${GRID_UI_ALLOWED_HOSTS:-}
      # Single sign-on for people, through your OpenID Connect identity provider (see the README's Users and
      # roles). All optional: left empty, the UI signs in with GRID_ADMIN_TOKEN alone, as before. Setting
      # GRID_OIDC_ISSUER turns it on; it then needs the client id, the secret (or a token the platform issues) and
      # GRID_UI_PUBLIC_URL too.
      GRID_OIDC_ISSUER: ${GRID_OIDC_ISSUER:-}
      GRID_OIDC_CLIENT_ID: ${GRID_OIDC_CLIENT_ID:-}
      GRID_OIDC_CLIENT_SECRET: ${GRID_OIDC_CLIENT_SECRET:-}
      # In place of the secret, with GRID_OIDC_CLIENT_AUTH=federated only: a file inside the container that holds
      # a token the platform issues for the identity provider (see the README's Single sign-on without a client
      # secret). In a Kubernetes pod with Azure workload identity the platform names the file itself, and this
      # stays empty.
      GRID_OIDC_FEDERATED_TOKEN_FILE: ${GRID_OIDC_FEDERATED_TOKEN_FILE:-}
      # Or, on an Azure VM with a managed identity: its client id (or system), with GRID_OIDC_CLIENT_AUTH=federated.
      # Every container on the VM, the runners included, can get that identity's token unless a firewall rule
      # stops them: see the README first.
      GRID_OIDC_MANAGED_IDENTITY: ${GRID_OIDC_MANAGED_IDENTITY:-}
      GRID_UI_PUBLIC_URL: ${GRID_UI_PUBLIC_URL:-}
      GRID_OIDC_ADMINS: ${GRID_OIDC_ADMINS:-}
      GRID_OIDC_LABEL: ${GRID_OIDC_LABEL:-}
      GRID_OIDC_SCOPES: ${GRID_OIDC_SCOPES:-}
      GRID_OIDC_GROUPS_CLAIM: ${GRID_OIDC_GROUPS_CLAIM:-}
      GRID_OIDC_CLIENT_AUTH: ${GRID_OIDC_CLIENT_AUTH:-}
      GRID_OIDC_END_SESSION: ${GRID_OIDC_END_SESSION:-}
      GRID_OIDC_CA_FILE: ${GRID_OIDC_CA_FILE:-}
      GRID_OIDC_ALLOW_HTTP: ${GRID_OIDC_ALLOW_HTTP:-}
      GRID_OIDC_CLOCK_SKEW_S: ${GRID_OIDC_CLOCK_SKEW_S:-}
      GRID_SESSION_HOURS: ${GRID_SESSION_HOURS:-}
      GRID_SESSION_IDLE_MINUTES: ${GRID_SESSION_IDLE_MINUTES:-}
      # Whether the overview, activity and sessions need sign-in (empty: they do with single sign-on), how
      # many reverse proxies are in front of the UI, and how many days its audit log keeps.
      GRID_UI_READS: ${GRID_UI_READS:-}
      GRID_UI_PROXY_HOPS: ${GRID_UI_PROXY_HOPS:-}
      GRID_AUDIT_DAYS: ${GRID_AUDIT_DAYS:-}
      # The UI's log (docker logs): from which level (empty: info), as text or json lines (empty: text),
      # and 1 for a line per request, without its query string (empty: none).
      GRID_UI_LOG_LEVEL: ${GRID_UI_LOG_LEVEL:-}
      GRID_UI_LOG_FORMAT: ${GRID_UI_LOG_FORMAT:-}
      GRID_UI_ACCESS_LOG: ${GRID_UI_ACCESS_LOG:-}
      # Encrypts the seeds on the MFA page and the sign-ins checks save there. Until it is set the page
      # takes no seeds and gives no codes, and checks can't save or reuse sign-ins. Seeds and sign-ins stored
      # under one key don't decrypt under another.
      GRID_SECRETS_KEY: ${GRID_SECRETS_KEY:-}
      # The agent token only tells the Access page that the hub has one ("set"), never its value. The
      # client token's value lets checks that connect with it also ask for MFA codes and use saved sign-ins,
      # acting as an admin: they get every MFA secret, and the sign-ins that are Admins' or shared with Admin
      # (while such a share still reaches admins: see Sharing in the README).
      # Once people use client tokens of their own, it can be left out here, after giving the checks in
      # docker-compose.poc.yaml that ask the UI a GRID_MFA_TOKEN of their own (in .env). The Access page then
      # asks for "Every access token" to make the grid's first client token or delete its last.
      GATEWAY_AGENT_TOKEN: ${GATEWAY_AGENT_TOKEN:+set}
      GATEWAY_CLIENT_TOKEN: ${GATEWAY_CLIENT_TOKEN:-}
    volumes:
      - ./src/database.yaml:/app/src/database.yaml:ro
      # A provider behind a private CA:
      # - ./certs/idp-ca.pem:/app/certs/idp-ca.pem:ro   # then GRID_OIDC_CA_FILE=/app/certs/idp-ca.pem


networks:
  playwright:
    driver: bridge
    ipam:
      config:
        - subnet: 172.50.221.0/24
