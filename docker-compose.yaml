version: "3.8"
services:
  web:
    container_name: python_playwright
    image: playwright_orchestrator_web
    build: ./docker/python
    networks:
      - playwright
  example_playwright:
    #user: "1032:1034" #userid of the playwright user
    container_name: example_playwright
    image: playwright_orchestrator_web:latest
    hostname: playright-example_playwright
    restart: always
    networks:
      - playwright
    volumes:
      - ./logs/example_playwright/:/app/logs/
      - ./src/:/app/src
      - ./main.py:/app/main.py
      - ./queue.db:/app/queue.db
      - ./full/example/example.py:/app/example.py
    command: python3 /app/main.py --fil example.py --fol /app/ -i 100
  grid_ui:
    container_name: playwright_grid_ui
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    restart: always
    networks:
      - playwright
    ports:
      - "127.0.0.1:4444:4444"
    environment:
      ORCHESTRATOR_CONFIG: /app/src/database.yaml
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${MYSQL_DATABASE:-orchestrator}
      DB_USER: ${MYSQL_USER:-orchestrator}
      DB_PASSWORD: ${MYSQL_PASSWORD:-orchestrator}
      # GRID_ADMIN_TOKEN: change-me  # require this token for management actions
    volumes:
      - ./src/database.yaml:/app/src/database.yaml:ro


networks:
  playwright:
    driver: bridge
    ipam:
      config:
        - subnet: 172.50.221.0/24
