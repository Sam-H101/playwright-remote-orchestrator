name: Docs

# The documentation site (mkdocs.yml, docs/): built with `mkdocs build --strict` on every pull request that
# touches it, so a broken link, a missing anchor or a page left out of the nav fails the check; built again and
# deployed to GitHub Pages from master. Pages must be set to deploy from GitHub Actions (Settings, Pages,
# Source: GitHub Actions). The GitLab Pages build of the same site is the pages job in .gitlab-ci.yml.

on:
  push:
    branches: [master]
    paths: ['docs/**', 'mkdocs.yml', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'mkdocs.yml', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: mkdocs build --strict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read # configure-pages reads the site's address
    env:
      DEPLOY: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: install mkdocs-material (docs/requirements.txt)
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt

      - name: Pages settings
        id: pages
        if: env.DEPLOY == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: build
        # site_url is mkdocs.yml's: the site's custom domain, set in Settings → Pages.
        run: mkdocs build --strict --site-dir site

      - name: upload the site
        if: env.DEPLOY == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write # deploy-pages proves the artifact came from this run
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One deployment at a time; a newer one waits rather than cancelling one in progress.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
