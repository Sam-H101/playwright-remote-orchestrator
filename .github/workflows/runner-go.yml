name: pwrunner (Go)

on:
  push:
    branches: [master]
    tags: ['pwrunner/v*']
    paths: ['runner/**', 'gateway/**', '.github/workflows/runner-go.yml']
  pull_request:
    paths: ['runner/**', 'gateway/**', '.github/workflows/runner-go.yml']
  workflow_dispatch:
    inputs:
      dry_run:
        description: build every release artefact and upload them to the run instead of creating a release
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    name: vet, lint and unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: runner
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: gateway dependencies (the fake run-server needs ws)
        working-directory: gateway
        run: npm ci
      - name: gofmt
        # Linux only: a Windows checkout has CRLF line endings, which gofmt reports.
        if: runner.os == 'Linux'
        run: |
          out="$(gofmt -l .)"
          echo "$out"
          test -z "$out"
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: unit tests (race detector on Linux, where cgo is available)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then go test -race ./...; else go test ./...; fi
      - name: integration tests against the Node hub
        run: go test -tags integration -count=1 ./test/integration/...

  build:
    name: build matrix
    runs-on: windows-latest
    needs: test
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runner
        shell: powershell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.sum
      - uses: actions/cache@v4
        with:
          path: runner/internal/runtime/files
          key: runtime-files-${{ hashFiles('runner/internal/runtime/pins.go') }}
      - name: version
        id: version
        run: |
          # A release tag pwrunner/v1.2.3 builds version 1.2.3; anything else a CI version.
          $v = if ($env:GITHUB_REF -like 'refs/tags/pwrunner/v*') { $env:GITHUB_REF -replace '^refs/tags/pwrunner/v', '' } else { "ci-${{ github.run_number }}" }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
      - name: build
        run: .\build\build.ps1 -Version "${{ steps.version.outputs.version }}"
      - name: check the artefacts
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $want = "pwrunner-$v-windows-amd64.exe", "pwrunner-$v-windows-arm64.exe", "pwrunner-$v-windows-amd64-slim.exe",
            "pwrunner-$v-linux-amd64", "pwrunner-$v-linux-arm64", "pwrunner-runtime-$v-windows-amd64.zip", 'SHA256SUMS.txt'
          foreach ($f in $want) { if (-not (Test-Path "dist\$f")) { throw "missing dist\$f" } }
          $line = & "dist\pwrunner-$v-windows-amd64.exe" version
          Write-Host $line
          if ($line -notmatch 'embedded=yes') { throw "embedded build does not report embedded=yes: $line" }
      - uses: actions/upload-artifact@v4
        with:
          name: pwrunner-${{ steps.version.outputs.version }}
          path: runner/dist/*
          if-no-files-found: error
    outputs:
      version: ${{ steps.version.outputs.version }}

  release:
    name: GitHub release
    # Only for a pwrunner/v* tag; a workflow_dispatch dry run stops at the uploaded build artefacts.
    if: startsWith(github.ref, 'refs/tags/pwrunner/v')
    runs-on: ubuntu-latest
    needs: [build, contract]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pwrunner-${{ needs.build.outputs.version }}
          path: dist
      - name: create the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum -c SHA256SUMS.txt
          # Unsigned: there is no code-signing certificate yet. With one, sign the .exe files here
          # (signtool sign /fd sha256 /tr <timestamp url> /td sha256 /f <cert> ...) and regenerate SHA256SUMS.txt.
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "pwrunner ${{ needs.build.outputs.version }}" \
            --notes "Windows runner host for the Playwright gateway. Verify downloads against SHA256SUMS.txt." *

  contract:
    name: agent contract suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: build pwrunner
        working-directory: runner
        run: go build -ldflags "-X main.version=contract" -o "$RUNNER_TEMP/pwrunner$( [ "$RUNNER_OS" = Windows ] && echo .exe )" ./cmd/pwrunner
      - name: contract suite against agent.js
        working-directory: gateway
        run: npm ci && node --test test/agent-contract.test.js
      - name: contract suite against pwrunner
        working-directory: gateway
        run: AGENT_CMD="$RUNNER_TEMP/pwrunner run" AGENT_VERSION=contract node --test test/agent-contract.test.js
