name: pwrunner (Go)

on:
  push:
    branches: [master]
    tags: ['pwrunner/v*']
    paths: ['runner/**', 'gateway/**', '.github/workflows/runner-go.yml']
  pull_request:
    paths: ['runner/**', 'gateway/**', '.github/workflows/runner-go.yml']
  # release.yml calls this for every vX.Y.Z release: it builds that tag and attaches the binaries.
  workflow_call:
    inputs:
      tag:
        description: a vX.Y.Z release to build and attach the binaries to
        type: string
        required: true
  workflow_dispatch:
    inputs:
      dry_run:
        description: build every release artefact and upload them to the run instead of releasing them
        type: boolean
        default: true
      tag:
        description: with dry_run off, a vX.Y.Z release to build and attach the binaries to (a backfill)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  test:
    name: vet, lint and unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: runner
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }} # a release's tag, or what started the run
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: gateway dependencies (the fake run-server needs ws)
        working-directory: gateway
        run: npm ci
      - name: gofmt
        # Linux only: a Windows checkout has CRLF line endings, which gofmt reports.
        if: runner.os == 'Linux'
        run: |
          out="$(gofmt -l .)"
          echo "$out"
          test -z "$out"
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: unit tests (race detector on Linux, where cgo is available)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then go test -race ./...; else go test ./...; fi
      - name: integration tests against the Node hub
        run: go test -tags integration -count=1 ./test/integration/...

  build:
    name: build matrix
    runs-on: windows-latest
    needs: test
    timeout-minutes: 20
    defaults:
      run:
        working-directory: runner
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }} # a release's tag, or what started the run
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.sum
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runner/internal/runtime/files
          key: runtime-files-${{ hashFiles('runner/internal/runtime/pins.go', 'runner/playwright/package-lock.json') }}
      - name: version
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          # A release (a vX.Y.Z tag from release.yml, or a pwrunner/vX.Y.Z tag) builds version X.Y.Z;
          # anything else a CI version.
          if ($env:TAG) {
            if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "tag must be vX.Y.Z, not '$env:TAG'" }
            $v = $env:TAG.Substring(1)
          } elseif ($env:GITHUB_REF -like 'refs/tags/pwrunner/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/pwrunner/v', ''
          } else {
            $v = "ci-${{ github.run_number }}"
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
      - name: build
        run: .\build\build.ps1 -Version "${{ steps.version.outputs.version }}"
      - name: check the artefacts
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $want = "pwrunner-$v-windows-amd64.exe", "pwrunner-$v-windows-arm64.exe", "pwrunner-$v-windows-amd64-slim.exe",
            "pwrunner-$v-linux-amd64", "pwrunner-$v-linux-arm64", "pwrunner-runtime-$v-windows-amd64.zip", 'SHA256SUMS.txt'
          foreach ($f in $want) { if (-not (Test-Path "dist\$f")) { throw "missing dist\$f" } }
          $line = & "dist\pwrunner-$v-windows-amd64.exe" version
          Write-Host $line
          if ($line -notmatch 'embedded=yes') { throw "embedded build does not report embedded=yes: $line" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pwrunner-${{ steps.version.outputs.version }}
          path: runner/dist/*
          if-no-files-found: error
    outputs:
      version: ${{ steps.version.outputs.version }}

  attach:
    name: attach to the release
    # For a vX.Y.Z release (called from release.yml, or a dispatch with a tag and dry_run off): the
    # release exists already, so the binaries are added to it, replacing any from an earlier attempt.
    if: inputs.tag != '' && inputs.dry_run != true
    runs-on: ubuntu-latest
    needs: [build, contract]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pwrunner-${{ needs.build.outputs.version }}
          path: dist
      - name: attach the binaries
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          sha256sum -c SHA256SUMS.txt
          # Unsigned, as below.
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber ./*
          echo "Attached the runner binaries to [$TAG]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG)." >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub release
    # Only for a pwrunner/v* tag; a workflow_dispatch dry run stops at the uploaded build artefacts.
    if: startsWith(github.ref, 'refs/tags/pwrunner/v') && inputs.tag == ''
    runs-on: ubuntu-latest
    needs: [build, contract]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pwrunner-${{ needs.build.outputs.version }}
          path: dist
      - name: create the release
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sha256sum -c SHA256SUMS.txt
          # Latest only if it's the newest release: the vX.Y.Z releases release.yml makes on every merge
          # share these numbers, and one may have gone out while this built.
          newest=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/" --jq '.[].ref' | sed -E 's#^refs/tags/##' \
            | { grep -E '^(pwrunner/)?v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sed -E 's#^(pwrunner/)?v##' | sort -V | tail -n 1)
          top=$(printf '%s\n%s\n' "$newest" "$VERSION" | sed '/^$/d' | sort -V | tail -n 1)
          # Unsigned: there is no code-signing certificate yet. With one, sign the .exe files here
          # (signtool sign /fd sha256 /tr <timestamp url> /td sha256 /f <cert> ...) and regenerate SHA256SUMS.txt.
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "pwrunner $VERSION" \
            --latest="$([ "$top" = "$VERSION" ] && echo true || echo false)" \
            --notes "Windows runner host for the Playwright gateway. Verify downloads against SHA256SUMS.txt." *

  contract:
    name: agent contract suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }} # a release's tag, or what started the run
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: build pwrunner
        working-directory: runner
        run: go build -ldflags "-X main.version=contract" -o "$RUNNER_TEMP/pwrunner$( [ "$RUNNER_OS" = Windows ] && echo .exe )" ./cmd/pwrunner
      - name: contract suite against agent.js
        working-directory: gateway
        run: npm ci && node --test test/agent-contract.test.js
      - name: contract suite against pwrunner
        working-directory: gateway
        run: AGENT_CMD="$RUNNER_TEMP/pwrunner run" AGENT_VERSION=contract node --test test/agent-contract.test.js
