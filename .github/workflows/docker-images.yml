name: Docker images

# Builds the hub, runner, Grid UI and checks images and publishes them to GitHub Container Registry as
# ghcr.io/<owner>/playwright-remote-orchestrator/<name>:
#   master                    -> :edge and :sha-<short sha>
#   tag pwrunner/v1.2.3 or v1.2.3 -> :1.2.3, :1.2 and :latest
#   called by release.yml, or workflow_dispatch
#                             -> builds `ref` and tags it `version`, :X.Y and :latest (dispatch: e.g.
#                                for a tag pushed before this workflow existed)
# :latest and :X.Y move only to the newest release (and the newest of that X.Y), so publishing an older
# version again (a re-run, a backfill, a late tag) can't take them back.
# Pull requests only build (amd64), to catch a broken Dockerfile before it merges.

on:
  push:
    branches: [master]
    tags: ['v*', 'pwrunner/v*']
    paths: ['docker/**', 'gateway/**', 'ui/**', 'src/schema.sql', '.github/workflows/docker-images.yml']
  pull_request:
    paths: ['docker/**', 'gateway/**', 'ui/**', 'src/schema.sql', '.github/workflows/docker-images.yml']
  workflow_call:
    inputs:
      ref:
        description: git ref to build
        type: string
        default: ''
      version:
        description: image tag for that ref, e.g. 1.2.3
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      ref:
        description: git ref to build, e.g. pwrunner/v1.1.0 (empty = the branch the workflow runs on)
        default: ''
      version:
        description: image tag for that ref, e.g. 1.1.0 (empty = edge); :latest only if it's the newest release, :X.Y if the newest of its X.Y
        default: ''

permissions:
  contents: read
  packages: write

defaults:
  run:
    shell: bash # -eo pipefail: a failure anywhere in a pipeline fails the step

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hub
            file: docker/hub/Dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
          - name: runner
            file: docker/runner/Dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
          - name: grid-ui
            file: docker/ui/Dockerfile
            context: .
            platforms: linux/amd64,linux/arm64
          # The image main.py checks run in (compose service web / example_playwright). amd64 only:
          # its trust-store fix links the x86_64 p11-kit library by path.
          - name: checks
            file: docker/python/Dockerfile
            context: docker/python
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: newest release?
        id: rank
        if: inputs.version != '' || startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ inputs.version }}
        run: |
          v=${VERSION:-$GITHUB_REF_NAME}
          v=${v#pwrunner/}
          v=${v#v}
          if ! echo "$v" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "latest=false" >> "$GITHUB_OUTPUT"; echo "xy=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Every release as it is now, on the remote: this may be a re-run of an old one.
          remote=$(git ls-remote --tags origin)
          # A release of this number made from another commit is that commit's: don't overwrite its images.
          head=$(git rev-parse HEAD)
          for t in "v$v" "pwrunner/v$v"; do
            at=$(echo "$remote" | awk -v r="refs/tags/$t" '$2 == r "^{}" { peeled = $1 } $2 == r { plain = $1 } END { print peeled ? peeled : plain }')
            if [ -n "$at" ] && [ "$at" != "$head" ]; then
              echo "::error::$t is ${at:0:7}, but this is building ${head:0:7}."
              exit 1
            fi
          done
          releases=$(echo "$remote" | sed -E 's#.*refs/tags/##' \
            | { grep -E '^(pwrunner/)?v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sed -E 's#^(pwrunner/)?v##')
          all=$(printf '%s\n%s\n' "$releases" "$v" | sed '/^$/d' | sort -V)
          newest=$(echo "$all" | tail -n 1)
          newest_xy=$(echo "$all" | awk -F. -v xy="${v%.*}" '$1 "." $2 == xy' | tail -n 1)
          echo "latest=$([ "$v" = "$newest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "xy=$([ "$v" = "$newest_xy" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "$v: the newest release is $newest, and the newest ${v%.*}.x is $newest_xy"

      - name: image name
        id: name
        # Registry paths must be lower-case; the owner is Sam-H101.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - name: tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.name.outputs.image }}
          flavor: latest=false
          tags: |
            type=match,pattern=pwrunner/v(\d+\.\d+\.\d+),group=1
            type=match,pattern=pwrunner/v(\d+\.\d+)\.\d+,group=1,enable=${{ steps.rank.outputs.xy == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.rank.outputs.xy == 'true' }}
            type=raw,value=latest,enable=${{ steps.rank.outputs.latest == 'true' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }},priority=901
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' && steps.rank.outputs.xy == 'true' }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/master' && inputs.version == '' }}
            type=sha,format=short,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && inputs.version == '' }}
            type=ref,event=pr

      - uses: docker/setup-qemu-action@v4
        if: github.event_name != 'pull_request' && contains(matrix.platforms, 'arm64')

      - uses: docker/setup-buildx-action@v4

      - name: log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build${{ github.event_name != 'pull_request' && ' and push' || '' }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || matrix.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: summary
        if: github.event_name != 'pull_request'
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
