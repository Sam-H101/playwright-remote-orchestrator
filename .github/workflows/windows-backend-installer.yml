name: Windows backend installer

on:
  push:
    paths:
      - 'installer/windows/**'
      - 'gateway/**'
      - 'runner/**'
      - '.github/workflows/windows-backend-installer.yml'
  pull_request:
    paths:
      - 'installer/windows/**'
      - 'gateway/**'
      - 'runner/**'
      - '.github/workflows/windows-backend-installer.yml'
  workflow_dispatch:

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        # Windows PowerShell 5.1, which is what a fresh Windows host has.
        shell: powershell
    env:
      INSTALL_DIR: C:\PlaywrightBackend
      HUB_HTTP: http://127.0.0.1:4500
      PWRUNNER: C:\pwbuild\pwrunner.exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.sum

      - name: Parse scripts
        run: |
          $failed = $false
          Get-ChildItem installer/windows -Include *.ps1, *.psm1 -Recurse | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "::error file=$($_.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Go vet and unit tests
        working-directory: runner
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run honnef.co/go/tools/cmd/staticcheck@latest ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/cache@v4
        with:
          path: runner/internal/runtime/files
          key: runtime-files-${{ hashFiles('runner/internal/runtime/pins.go') }}

      - name: Build pwrunner with the runtime embedded
        working-directory: runner
        run: |
          go run ./tools/fetchbundle --out .\internal\runtime\files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -tags embedruntime -ldflags "-s -w -X main.version=ci" -o $env:PWRUNNER ./cmd/pwrunner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $line = & $env:PWRUNNER version
          Write-Host $line
          if ($line -notmatch 'embedded=yes') { throw "not an embedded build: $line" }

      - name: Gateway unit tests and the agent contract suite (agent.js and pwrunner)
        working-directory: gateway
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/agent-contract.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:AGENT_CMD = "$env:PWRUNNER run"
          $env:AGENT_VERSION = 'ci'
          node --test test/agent-contract.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Start hub
        working-directory: gateway
        run: |
          $env:HUB_DB = 'memory'
          $env:HUB_PORT = '4500'
          $env:GATEWAY_AGENT_TOKEN = 'ci-token'
          # Without -Redirect*, Start-Process uses ShellExecute and the hub inherits none of this step's handles.
          # With them it would hold the step's output pipe open, and the runner kills such leftovers when the step ends.
          Start-Process cmd -ArgumentList '/c', "node hub.js > `"$env:RUNNER_TEMP\hub.log`" 2> `"$env:RUNNER_TEMP\hub.err.log`"" -WindowStyle Hidden | Out-Null
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Seconds 1
            try { $health = Invoke-RestMethod "$env:HUB_HTTP/healthz" } catch { $health = $null }
          } until ($health.ok -or (Get-Date) -gt $deadline)
          if (-not $health.ok) { Get-Content "$env:RUNNER_TEMP\hub*.log"; throw 'The hub did not come up' }

      - name: Legacy install with the PowerShell installer
        run: |
          .\installer\windows\install-backend.ps1 -InstallDir $env:INSTALL_DIR -HubUrl ws://127.0.0.1:4500 -AgentToken ci-token -NodeName ci-node-07 -Slots 2
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 2) { exit $LASTEXITCODE }
          if (-not (Get-ScheduledTask -TaskName PlaywrightBackend -ErrorAction SilentlyContinue)) { throw 'The legacy install registered no scheduled task' }
          $global:LASTEXITCODE = 0

      - name: Plant files in the install folder, as other users could
        run: |
          # After the legacy install, so the reset below is pwrunner's own. agent.token stays: its content is carried over.
          New-Item -ItemType Directory "$env:INSTALL_DIR\app\node_modules\planted" -Force | Out-Null
          Set-Content "$env:INSTALL_DIR\app\node_modules\planted\index.js" 'planted'
          Set-Content "$env:INSTALL_DIR\planted.cmd" 'planted'
          icacls $env:INSTALL_DIR /setowner '*S-1-5-32-545' /T /C /Q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Migrate to pwrunner
        run: |
          if (-not (Invoke-RestMethod "$env:HUB_HTTP/healthz").ok) { throw 'The hub is not running' }
          Set-Content "$env:RUNNER_TEMP\ci-token.txt" 'ci-token' -NoNewline
          & $env:PWRUNNER install --install-dir $env:INSTALL_DIR --hub-url ws://127.0.0.1:4500 --token-file "$env:RUNNER_TEMP\ci-token.txt" --name ci-node-07 --slots 2 --offline-dir runner\internal\runtime\files
          if ($LASTEXITCODE -ne 0) { Get-ChildItem "$env:INSTALL_DIR\logs" | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 40 }; exit $LASTEXITCODE }
          $status = Get-Content "$env:INSTALL_DIR\status.json" -Raw | ConvertFrom-Json
          if ($status.result -ne 'success' -or -not $status.registered -or $status.healthySlots -ne 2) { throw "Unexpected status: $($status | ConvertTo-Json)" }
          $node = (Invoke-RestMethod "$env:HUB_HTTP/api/nodes").nodes | Where-Object name -eq $status.node
          if (-not $node -or $node.slots -ne 2 -or $node.healthySlots -ne 2 -or $node.agentVersion -ne 'ci') { throw "Hub does not list $($status.node) as a pwrunner node with 2 healthy slots: $($node | ConvertTo-Json)" }
          foreach ($f in "$env:INSTALL_DIR\planted.cmd", "$env:INSTALL_DIR\app\node_modules\planted") { if (Test-Path $f) { throw "$f survived the install" } }
          $log = "$env:INSTALL_DIR\logs\install.log"
          foreach ($p in 'from scratch', 'Moved the PowerShell installer files to legacy\') {
            if (-not (Select-String -Path $log -Pattern $p -SimpleMatch -Quiet)) { throw "install.log lacks '$p'" }
          }
          if (Test-Path "$env:INSTALL_DIR\install-backend.ps1") { throw 'install-backend.ps1 was not moved to legacy\' }
          if (-not (Test-Path "$env:INSTALL_DIR\legacy\install-backend.ps1")) { throw 'legacy\install-backend.ps1 is missing' }
          if (Get-ScheduledTask -TaskName PlaywrightBackend -ErrorAction SilentlyContinue) { throw 'The legacy scheduled task still exists' }
          if ((Get-Service PlaywrightBackend).Status -ne 'Running') { throw 'The PlaywrightBackend service is not running' }
          if (Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*run-backend.ps1*' }) { throw 'A legacy supervisor still runs' }
          Write-Host "Node $($status.node) migrated: 2 healthy slots, service running"
          Add-Content -Path $env:GITHUB_ENV -Value "CI_NODE=$($status.node)" -Encoding ASCII

      - name: Token is not exposed and the install is not writable by users
        run: |
          $acl = Get-Acl "$env:INSTALL_DIR\agent.token"
          $sids = $acl.Access | ForEach-Object { $_.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value }
          $extra = @($sids | Where-Object { $_ -ne 'S-1-5-18' -and $_ -ne 'S-1-5-32-544' })
          if (-not $acl.AreAccessRulesProtected -or $extra.Count) { throw "agent.token is readable by more than SYSTEM and Administrators: $($acl.AccessToString)" }
          # The service runs these as SYSTEM, so only SYSTEM and Administrators may change them, owning included.
          $runs = "$env:INSTALL_DIR\pwrunner.exe", "$env:INSTALL_DIR\app\node_modules\playwright-core\cli.js", "$env:INSTALL_DIR\runtime\node\node.exe"
          foreach ($f in @($env:INSTALL_DIR, "$env:INSTALL_DIR\agent.token") + $runs) {
            $owner = (Get-Acl $f).GetOwner([Security.Principal.SecurityIdentifier]).Value
            if ($owner -ne 'S-1-5-18' -and $owner -ne 'S-1-5-32-544') { throw "$f is owned by $((Get-Acl $f).Owner)" }
          }
          foreach ($f in @($env:INSTALL_DIR) + $runs) {
            $writers = @((Get-Acl $f).Access | Where-Object {
              $sid = $_.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value
              $sid -ne 'S-1-5-18' -and $sid -ne 'S-1-5-32-544' -and ([int]$_.FileSystemRights -band 0x40000116)   # GENERIC_WRITE or any of the Write rights
            })
            if ($writers.Count) { throw "$f is writable by $($writers.IdentityReference -join ', ')" }
          }
          $leaks = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*ci-token*' })
          if ($leaks.Count) { throw "Token on a command line: $($leaks.CommandLine)" }
          foreach ($f in Get-ChildItem "$env:INSTALL_DIR\logs", "$env:INSTALL_DIR\*.json" -File) {
            if (Select-String -Path $f.FullName -Pattern 'ci-token' -SimpleMatch -Quiet) { throw "Token written to $($f.FullName)" }
          }

      - name: Re-run the installed copy (keeps every setting, skips the runtime)
        run: |
          & "$env:INSTALL_DIR\pwrunner.exe" install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path "$env:INSTALL_DIR\logs\install.log" -Pattern 'already installed, skipping npm' -Quiet)) { throw 'The re-run did not skip the runtime' }
          $cfg = Get-Content "$env:INSTALL_DIR\backend.json" -Raw | ConvertFrom-Json
          if ($cfg.nodeName -ne $env:CI_NODE -or $cfg.slots -ne 2) { throw "The re-run changed the settings: $($cfg | ConvertTo-Json)" }

      - name: A failed upgrade restarts the previous install
        run: |
          & $env:PWRUNNER install --install-dir $env:INSTALL_DIR --playwright-version 0.0.0-does-not-exist --playwright-integrity sha512-AAAA
          if ($LASTEXITCODE -ne 1) { throw "Expected exit code 1, got $LASTEXITCODE" }
          $status = Get-Content "$env:INSTALL_DIR\status.json" -Raw | ConvertFrom-Json
          if ($status.failedStep -ne 'install node packages' -or -not $status.restartedPrevious) { throw "Unexpected status: $($status | ConvertTo-Json)" }
          & $env:PWRUNNER status --install-dir $env:INSTALL_DIR --health-timeout 90
          if ($LASTEXITCODE -ne 0) { throw 'The previous install did not come back' }
          $manifest = Get-Content "$env:INSTALL_DIR\manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.playwrightVersion -ne '1.64.1') { throw "app\ changed: $($manifest | ConvertTo-Json)" }

      - name: Connect clients through the hub
        run: |
          # The hub picks the slot: two browsers at once take both of the node's slots.
          $client = @'
          const { chromium } = require(process.env.INSTALL_DIR + '\\app\\node_modules\\playwright-core');
          const url = `ws://127.0.0.1:4500/connect?node=${encodeURIComponent(process.env.CI_NODE)}`;
          (async () => {
            const browsers = await Promise.all([1, 2].map(() => chromium.connect(url, { timeout: 60000 })));
            for (const [i, browser] of browsers.entries()) {
              const page = await browser.newPage();
              await page.setContent('<h1>ok</h1>');
              const text = await page.textContent('h1');
              if (text !== 'ok') throw new Error(`session ${i + 1}: got ${text}`);
              console.log(`session ${i + 1} through ${url}: ok`);
            }
            await Promise.all(browsers.map((b) => b.close()));
          })().catch(e => { console.error(e); process.exit(1); });
          '@
          Set-Content -Path "$env:RUNNER_TEMP\client.js" -Value $client
          node "$env:RUNNER_TEMP\client.js"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PWRUNNER status --install-dir $env:INSTALL_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: The service restarts a killed agent
        run: |
          $old = (Get-Content "$env:INSTALL_DIR\runtime.json" -Raw | ConvertFrom-Json).pid
          Stop-Process -Id $old -Force
          Start-Sleep -Seconds 1
          & $env:PWRUNNER status --install-dir $env:INSTALL_DIR --health-timeout 90
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:INSTALL_DIR\logs\service.log"; throw 'The agent did not come back' }
          $new = (Get-Content "$env:INSTALL_DIR\runtime.json" -Raw | ConvertFrom-Json).pid
          if ($new -eq $old) { throw "runtime.json still names the killed agent ($old)" }

      - name: Stopping the service stops the agent and reports degraded
        run: |
          Stop-Service PlaywrightBackend
          Start-Sleep -Seconds 5
          $left = @(Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" | Where-Object ExecutablePath -like "$env:INSTALL_DIR\runtime\*")
          if ($left.Count) { throw "Still running after Stop-Service: $($left.ProcessId -join ', ')" }
          if ((Invoke-RestMethod "$env:HUB_HTTP/api/nodes").nodes | Where-Object name -eq $env:CI_NODE) { throw 'Hub still lists the node' }
          & $env:PWRUNNER status --install-dir $env:INSTALL_DIR --json
          if ($LASTEXITCODE -ne 2) { throw "Expected exit code 2, got $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

      - name: Uninstall
        run: |
          & $env:PWRUNNER uninstall --install-dir $env:INSTALL_DIR --remove-files --yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path $env:INSTALL_DIR) { throw 'Install dir still exists' }
          if (Get-Service PlaywrightBackend -ErrorAction SilentlyContinue) { throw 'Service still registered' }

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-logs
          path: |
            C:\PlaywrightBackend\logs
            C:\PlaywrightBackend\*.json
            ${{ runner.temp }}\hub*.log
          if-no-files-found: ignore
