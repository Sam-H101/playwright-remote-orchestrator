name: Windows backend installer

on:
  push:
    paths:
      - 'installer/windows/**'
      - 'gateway/**'
      - 'runner/**'
      # The gateway's npm test pins the schema's CREATE TABLE statements.
      - 'src/schema.sql'
      - '.github/workflows/windows-backend-installer.yml'
  pull_request:
    paths:
      - 'installer/windows/**'
      - 'gateway/**'
      - 'runner/**'
      - 'src/schema.sql'
      - '.github/workflows/windows-backend-installer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        # Windows PowerShell 5.1, which is what a fresh Windows host has.
        shell: powershell
    env:
      INSTALL_DIR: C:\PlaywrightBackend
      HUB_HTTP: http://127.0.0.1:4500
      PWRUNNER: C:\pwbuild\pwrunner.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.sum

      - name: Parse scripts
        run: |
          $failed = $false
          Get-ChildItem installer/windows -Include *.ps1, *.psm1 -Recurse | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Host "::error file=$($_.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Go vet and unit tests
        working-directory: runner
        run: |
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go run honnef.co/go/tools/cmd/staticcheck@latest ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runner/internal/runtime/files
          key: runtime-files-${{ hashFiles('runner/internal/runtime/pins.go', 'runner/playwright/package-lock.json') }}

      - name: Build pwrunner with the runtime embedded
        working-directory: runner
        run: |
          go run ./tools/fetchbundle --out .\internal\runtime\files
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go build -tags embedruntime -ldflags "-s -w -X main.version=ci" -o $env:PWRUNNER ./cmd/pwrunner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $line = & $env:PWRUNNER version
          Write-Host $line
          if ($line -notmatch 'embedded=yes') { throw "not an embedded build: $line" }

      - name: Gateway unit tests and the agent contract suite (agent.js and pwrunner)
        working-directory: gateway
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --test test/agent-contract.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:AGENT_CMD = "$env:PWRUNNER run"
          $env:AGENT_VERSION = 'ci'
          node --test test/agent-contract.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Start hub
        working-directory: gateway
        run: |
          $env:HUB_DB = 'memory'
          $env:HUB_PORT = '4500'
          $env:GATEWAY_AGENT_TOKEN = 'ci-token'
          # Without -Redirect*, Start-Process uses ShellExecute and the hub inherits none of this step's handles.
          # With them it would hold the step's output pipe open, and the runner kills such leftovers when the step ends.
          Start-Process cmd -ArgumentList '/c', "node hub.js > `"$env:RUNNER_TEMP\hub.log`" 2> `"$env:RUNNER_TEMP\hub.err.log`"" -WindowStyle Hidden | Out-Null
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Seconds 1
            try { $health = Invoke-RestMethod "$env:HUB_HTTP/healthz" } catch { $health = $null }
          } until ($health.ok -or (Get-Date) -gt $deadline)
          if (-not $health.ok) { Get-Content "$env:RUNNER_TEMP\hub*.log"; throw 'The hub did not come up' }

      - name: Legacy install with the PowerShell installer
        run: |
          .\installer\windows\install-backend.ps1 -InstallDir $env:INSTALL_DIR -HubUrl ws://127.0.0.1:4500 -AgentToken ci-token -NodeName ci-node-07 -Slots 2
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 2) { exit $LASTEXITCODE }
          if (-not (Get-ScheduledTask -TaskName PlaywrightBackend -ErrorAction SilentlyContinue)) { throw 'The legacy install registered no scheduled task' }
          $global:LASTEXITCODE = 0

      - name: Plant files in the install folder, as other users could
        run: |
          # After the legacy install, so the reset below is pwrunner's own. agent.token stays: its content is carried over.
          New-Item -ItemType Directory "$env:INSTALL_DIR\app\node_modules\planted" -Force | Out-Null
          Set-Content "$env:INSTALL_DIR\app\node_modules\planted\index.js" 'planted'
          Set-Content "$env:INSTALL_DIR\planted.cmd" 'planted'
          icacls $env:INSTALL_DIR /setowner '*S-1-5-32-545' /T /C /Q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Plant the single browser account of an install from before each slot had its own
        run: |
          # pwbrowser-<first 4 bytes of sha256(lower-case service name), hex>: install must remove it.
          $sha = [Security.Cryptography.SHA256]::Create()
          $hash = -join ($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes('playwrightbackend'))[0..3] | ForEach-Object { $_.ToString('x2') })
          $legacy = "pwbrowser-$hash"
          New-LocalUser -Name $legacy -NoPassword -Description 'legacy browser account (CI)' | Out-Null
          Add-Content -Path $env:GITHUB_ENV -Value "LEGACY_ACCOUNT=$legacy", "ACCOUNT_HASH=$hash" -Encoding ASCII

      - name: Migrate to pwrunner
        run: |
          if (-not (Invoke-RestMethod "$env:HUB_HTTP/healthz").ok) { throw 'The hub is not running' }
          Set-Content "$env:RUNNER_TEMP\ci-token.txt" 'ci-token' -NoNewline
          & $env:PWRUNNER install --install-dir $env:INSTALL_DIR --hub-url ws://127.0.0.1:4500 --token-file "$env:RUNNER_TEMP\ci-token.txt" --name ci-node-07 --slots 2 --offline-dir runner\internal\runtime\files
          if ($LASTEXITCODE -ne 0) { Get-ChildItem "$env:INSTALL_DIR\logs" | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 40 }; exit $LASTEXITCODE }
          $status = Get-Content "$env:INSTALL_DIR\status.json" -Raw | ConvertFrom-Json
          if ($status.result -ne 'success' -or -not $status.registered -or $status.healthySlots -ne 2) { throw "Unexpected status: $($status | ConvertTo-Json)" }
          $node = (Invoke-RestMethod "$env:HUB_HTTP/api/nodes").nodes | Where-Object name -eq $status.node
          if (-not $node -or $node.slots -ne 2 -or $node.healthySlots -ne 2 -or $node.agentVersion -ne 'ci') { throw "Hub does not list $($status.node) as a pwrunner node with 2 healthy slots: $($node | ConvertTo-Json)" }
          foreach ($f in "$env:INSTALL_DIR\planted.cmd", "$env:INSTALL_DIR\app\node_modules\planted") { if (Test-Path $f) { throw "$f survived the install" } }
          $log = "$env:INSTALL_DIR\logs\install.log"
          foreach ($p in 'from scratch', 'Moved the PowerShell installer files to legacy\') {
            if (-not (Select-String -Path $log -Pattern $p -SimpleMatch -Quiet)) { throw "install.log lacks '$p'" }
          }
          if (Test-Path "$env:INSTALL_DIR\install-backend.ps1") { throw 'install-backend.ps1 was not moved to legacy\' }
          if (-not (Test-Path "$env:INSTALL_DIR\legacy\install-backend.ps1")) { throw 'legacy\install-backend.ps1 is missing' }
          if (Get-ScheduledTask -TaskName PlaywrightBackend -ErrorAction SilentlyContinue) { throw 'The legacy scheduled task still exists' }
          if ((Get-Service PlaywrightBackend).Status -ne 'Running') { throw 'The PlaywrightBackend service is not running' }
          if (Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*run-backend.ps1*' }) { throw 'A legacy supervisor still runs' }
          Write-Host "Node $($status.node) migrated: 2 healthy slots, service running"
          Add-Content -Path $env:GITHUB_ENV -Value "CI_NODE=$($status.node)" -Encoding ASCII

      - name: Each slot's run-server runs as its own browser account, not as SYSTEM
        run: |
          $cfg = Get-Content "$env:INSTALL_DIR\backend.json" -Raw | ConvertFrom-Json
          if ($cfg.PSObject.Properties.Name -contains 'browserAccount') { throw "backend.json still has the legacy browserAccount: $($cfg.browserAccount)" }
          $accounts = @($cfg.browserAccounts)
          if ($accounts.Count -ne 2 -or @($accounts | Select-Object -Unique).Count -ne 2) { throw "backend.json must list two distinct browser accounts: '$($accounts -join ', ')'" }
          if (Get-LocalUser -Name $env:LEGACY_ACCOUNT -ErrorAction SilentlyContinue) { throw "The legacy single account $env:LEGACY_ACCOUNT survived the install" }
          secedit /export /areas USER_RIGHTS /cfg "$env:RUNNER_TEMP\rights.inf" | Out-Null
          $rights = Get-Content "$env:RUNNER_TEMP\rights.inf"
          $sids = @()
          for ($i = 0; $i -lt $accounts.Count; $i++) {
            $account = $accounts[$i]
            if ($account -ne "pwb-$env:ACCOUNT_HASH-$($i + 1)") { throw "slot $($i + 1): account '$account', want pwb-$env:ACCOUNT_HASH-$($i + 1)" }
            $user = Get-LocalUser -Name $account
            if (-not $user.Enabled -or $user.PasswordExpires -or $user.UserMayChangePassword) { throw "$account is not a locked-down service account: $($user | Format-List * | Out-String)" }
            $sid = $user.SID.Value
            if (Get-LocalGroupMember -SID 'S-1-5-32-544' | Where-Object { $_.SID.Value -eq $sid }) { throw "$account is an administrator" }
            $hidden = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\UserList' -Name $account -ErrorAction SilentlyContinue
            if (-not $hidden -or $hidden.$account -ne 0) { throw "$account is not hidden from the sign-in screen" }
            foreach ($r in 'SeBatchLogonRight', 'SeDenyInteractiveLogonRight', 'SeDenyRemoteInteractiveLogonRight', 'SeDenyNetworkLogonRight') {
              $line = @($rights | Where-Object { $_ -like "$r *" })
              if (-not ($line -match [regex]::Escape($sid)) -and -not ($line -match "\b$account\b")) { throw "$account lacks $r ($line)" }
            }
            $sids += $sid
          }
          # runtime.json names the run-servers; GetOwner says whose token each one runs with: slot i's account.
          $slots = (Get-Content "$env:INSTALL_DIR\runtime.json" -Raw | ConvertFrom-Json).slots
          if ($slots.Count -ne 2) { throw "runtime.json lists $($slots.Count) slots" }
          foreach ($slot in $slots) {
            $want = $accounts[$slot.index - 1]
            $p = Get-CimInstance Win32_Process -Filter "ProcessId = $($slot.pid)"
            if (-not $p -or $p.Name -ne 'node.exe') { throw "slot $($slot.index): no run-server with pid $($slot.pid)" }
            $owner = Invoke-CimMethod -InputObject $p -MethodName GetOwner
            if ($owner.User -ne $want) { throw "slot $($slot.index): run-server $($p.ProcessId) runs as $($owner.Domain)\$($owner.User), not $want" }
            Write-Host "slot $($slot.index): run-server $($p.ProcessId) runs as $want"
          }
          $line = "run-servers run as $($accounts[0]) in slot 1, $($accounts[1]) in slot 2"
          if (-not (Select-String -Path "$env:INSTALL_DIR\logs\agent.log" -Pattern $line -SimpleMatch -Quiet)) { throw "agent.log does not say '$line'" }
          # Where each account's browsers keep their profiles: under its own profile folder, which the other can't open.
          $profiles = $sids | ForEach-Object { (Get-CimInstance Win32_UserProfile -Filter "SID = '$_'").LocalPath }
          Add-Content -Path $env:GITHUB_ENV -Value "BROWSER_ACCOUNTS=$($accounts -join ',')", "BROWSER_SIDS=$($sids -join ',')", "BROWSER_PROFILES=$($profiles -join ',')" -Encoding ASCII

      - name: Token is not exposed and the install is not writable by users
        run: |
          $acl = Get-Acl "$env:INSTALL_DIR\agent.token"
          $sids = $acl.Access | ForEach-Object { $_.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value }
          $extra = @($sids | Where-Object { $_ -ne 'S-1-5-18' -and $_ -ne 'S-1-5-32-544' })
          if (-not $acl.AreAccessRulesProtected -or $extra.Count) { throw "agent.token is readable by more than SYSTEM and Administrators: $($acl.AccessToString)" }
          # The service runs these (pwrunner.exe as SYSTEM, run-server as the browser account), so only SYSTEM and
          # Administrators may change them, owning included.
          $runs = "$env:INSTALL_DIR\pwrunner.exe", "$env:INSTALL_DIR\app\node_modules\playwright-core\cli.js", "$env:INSTALL_DIR\runtime\node\node.exe"
          foreach ($f in @($env:INSTALL_DIR, "$env:INSTALL_DIR\agent.token") + $runs) {
            $owner = (Get-Acl $f).GetOwner([Security.Principal.SecurityIdentifier]).Value
            if ($owner -ne 'S-1-5-18' -and $owner -ne 'S-1-5-32-544') { throw "$f is owned by $((Get-Acl $f).Owner)" }
          }
          foreach ($f in @($env:INSTALL_DIR) + $runs) {
            $writers = @((Get-Acl $f).Access | Where-Object {
              $sid = $_.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value
              $sid -ne 'S-1-5-18' -and $sid -ne 'S-1-5-32-544' -and ([int]$_.FileSystemRights -band 0x40000116)   # GENERIC_WRITE or any of the Write rights
            })
            if ($writers.Count) { throw "$f is writable by $($writers.IdentityReference -join ', ')" }
          }
          $leaks = @(Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*ci-token*' })
          if ($leaks.Count) { throw "Token on a command line: $($leaks.CommandLine)" }
          foreach ($f in Get-ChildItem "$env:INSTALL_DIR\logs", "$env:INSTALL_DIR\*.json" -File) {
            if (Select-String -Path $f.FullName -Pattern 'ci-token' -SimpleMatch -Quiet) { throw "Token written to $($f.FullName)" }
          }
          # Nor run-server's secret endpoint path ("/" and 64 hex digits), which every slot's account could read there:
          # run-server prints it, and the agent masks it as /<endpoint>.
          foreach ($f in Get-ChildItem "$env:INSTALL_DIR\logs\slot-*.log*", "$env:INSTALL_DIR\logs\agent.log*", "$env:INSTALL_DIR\logs\service.log*", "$env:INSTALL_DIR\runtime.json" -File) {
            if (Select-String -Path $f.FullName -Pattern '/[0-9a-f]{64}' -CaseSensitive -Quiet) { throw "A run-server endpoint path is written to $($f.FullName)" }
          }
          if (-not (Select-String -Path "$env:INSTALL_DIR\logs\slot-1.log" -Pattern 'Listening on ws://127.0.0.1:\d+/<endpoint>' -Quiet)) { throw "slot-1.log lacks run-server's masked 'Listening on' line" }

      - name: Re-run the installed copy (keeps every setting, skips the runtime)
        run: |
          & "$env:INSTALL_DIR\pwrunner.exe" install
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path "$env:INSTALL_DIR\logs\install.log" -Pattern 'already installed, skipping npm' -Quiet)) { throw 'The re-run did not skip the runtime' }
          $cfg = Get-Content "$env:INSTALL_DIR\backend.json" -Raw | ConvertFrom-Json
          if ($cfg.nodeName -ne $env:CI_NODE -or $cfg.slots -ne 2) { throw "The re-run changed the settings: $($cfg | ConvertTo-Json)" }
          if (($cfg.browserAccounts -join ',') -ne $env:BROWSER_ACCOUNTS) { throw "The re-run changed the browser accounts: $($cfg.browserAccounts -join ',')" }

      - name: Fewer slots remove the extra browser account, more slots add it back
        run: |
          $accounts = $env:BROWSER_ACCOUNTS -split ','
          & "$env:INSTALL_DIR\pwrunner.exe" install --slots 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cfg = Get-Content "$env:INSTALL_DIR\backend.json" -Raw | ConvertFrom-Json
          if ($cfg.slots -ne 1 -or ($cfg.browserAccounts -join ',') -ne $accounts[0]) { throw "1 slot: $($cfg | ConvertTo-Json)" }
          if (Get-LocalUser -Name $accounts[1] -ErrorAction SilentlyContinue) { throw "$($accounts[1]) survived lowering the slots to 1" }
          if (-not (Get-LocalUser -Name $accounts[0] -ErrorAction SilentlyContinue)) { throw "$($accounts[0]) went too" }
          & "$env:INSTALL_DIR\pwrunner.exe" install --slots 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $cfg = Get-Content "$env:INSTALL_DIR\backend.json" -Raw | ConvertFrom-Json
          if ($cfg.slots -ne 2 -or ($cfg.browserAccounts -join ',') -ne $env:BROWSER_ACCOUNTS) { throw "2 slots again: $($cfg | ConvertTo-Json)" }
          # Slot 2's account is a new one, with a new SID and profile.
          $sids = $accounts | ForEach-Object { (Get-LocalUser -Name $_).SID.Value }
          $slots = (Get-Content "$env:INSTALL_DIR\runtime.json" -Raw | ConvertFrom-Json).slots
          foreach ($slot in $slots) {
            $owner = Invoke-CimMethod -InputObject (Get-CimInstance Win32_Process -Filter "ProcessId = $($slot.pid)") -MethodName GetOwner
            if ($owner.User -ne $accounts[$slot.index - 1]) { throw "slot $($slot.index) runs as $($owner.User)" }
          }
          $profiles = $sids | ForEach-Object { (Get-CimInstance Win32_UserProfile -Filter "SID = '$_'").LocalPath }
          Add-Content -Path $env:GITHUB_ENV -Value "BROWSER_SIDS=$($sids -join ',')", "BROWSER_PROFILES=$($profiles -join ',')" -Encoding ASCII

      - name: A failed upgrade restarts the previous install
        run: |
          & $env:PWRUNNER install --install-dir $env:INSTALL_DIR --playwright-version 0.0.0-does-not-exist --playwright-integrity sha512-AAAA
          if ($LASTEXITCODE -ne 1) { throw "Expected exit code 1, got $LASTEXITCODE" }
          $status = Get-Content "$env:INSTALL_DIR\status.json" -Raw | ConvertFrom-Json
          if ($status.failedStep -ne 'install node packages' -or -not $status.restartedPrevious) { throw "Unexpected status: $($status | ConvertTo-Json)" }
          & $env:PWRUNNER status --install-dir $env:INSTALL_DIR --health-timeout 90
          if ($LASTEXITCODE -ne 0) { throw 'The previous install did not come back' }
          $manifest = Get-Content "$env:INSTALL_DIR\manifest.json" -Raw | ConvertFrom-Json
          # The version the exe installed by default: the one runner/playwright pins.
          $pinned = (Get-Content runner\playwright\package.json -Raw | ConvertFrom-Json).dependencies.'playwright-core'
          if (-not $pinned -or $manifest.playwrightVersion -ne $pinned) { throw "app\ changed (pinned: $pinned): $($manifest | ConvertTo-Json)" }

      - name: Connect clients through the hub
        run: |
          # The hub picks the slot: two browsers at once take both of the node's slots.
          $client = @'
          const { chromium } = require(process.env.INSTALL_DIR + '\\app\\node_modules\\playwright-core');
          const url = `ws://127.0.0.1:4500/connect?node=${encodeURIComponent(process.env.CI_NODE)}`;
          (async () => {
            const browsers = await Promise.all([1, 2].map(() => chromium.connect(url, { timeout: 60000 })));
            for (const [i, browser] of browsers.entries()) {
              const page = await browser.newPage();
              await page.setContent('<h1>ok</h1>');
              const text = await page.textContent('h1');
              if (text !== 'ok') throw new Error(`session ${i + 1}: got ${text}`);
              console.log(`session ${i + 1} through ${url}: ok`);
            }
            // A check controls its browser, and file:// reads whatever the browser's account can. A file Users
            // can read must load (or the next check proves nothing); agent.token must not.
            const page = await browsers[0].newPage();
            const fileUrl = (name) => 'file:///' + (process.env.INSTALL_DIR + '\\' + name).replace(/\\/g, '/');
            await page.goto(fileUrl('backend.json'));
            if (!(await page.content()).includes(process.env.BROWSER_ACCOUNTS.split(',')[0])) throw new Error('file:// did not load backend.json');
            let refused = '';
            try {
              await page.goto(fileUrl('agent.token'));
            } catch (e) {
              refused = e.message.split('\n')[0];
            }
            if ((await page.content().catch(() => '')).includes('ci-token')) throw new Error('a session read agent.token through file://');
            // Access denied, not "not found" or a download: the browser tried the file and its account may not read it.
            if (!refused.includes('ERR_ACCESS_DENIED')) throw new Error(`file:// agent.token: expected ERR_ACCESS_DENIED, got '${refused}'`);
            console.log(`file:// backend.json loads; file:// agent.token: ${refused}`);
            // Each slot's browsers run as its own account and keep their profiles in its temp folder: a browser
            // can list its own account's temp folder and not the other slot's, where the other session's profile is.
            // Where that folder is comes from the account's environment, so look for the profiles (this step runs
            // as an administrator) under the accounts' profile folders and the system temp folders.
            const fs = require('fs');
            const path = require('path');
            const found = [];
            const walk = (dir, depth) => {
              let entries;
              try { entries = fs.readdirSync(dir, { withFileTypes: true }); } catch { return; }
              for (const e of entries) {
                if (!e.isDirectory() || e.isSymbolicLink()) continue;
                const full = path.join(dir, e.name);
                if (/^playwright_chromiumdev_profile-/.test(e.name)) found.push(full);
                else if (depth > 0) walk(full, depth - 1);
              }
            };
            for (const root of [...process.env.BROWSER_PROFILES.split(','), 'C:\\Windows\\Temp', 'C:\\Windows\\SystemTemp']) walk(root, 6);
            console.log(`browser profiles: ${found.join(', ') || 'none found'}`);
            const parents = [...new Set(found.map((f) => path.dirname(f)))];
            if (parents.length !== 2) throw new Error(`expected the two sessions' profiles in two folders, found them in ${parents.length}: ${parents.join(', ')}`);
            const temps = parents.map((p) => 'file:///' + (p + '\\').replace(/\\/g, '/'));
            for (const [i, browser] of browsers.entries()) {
              const p = await browser.newPage();
              const seen = [];
              for (const temp of temps) {
                let outcome;
                try {
                  await p.goto(temp);
                  const html = await p.content();
                  outcome = /playwright[_-]/i.test(html) ? 'lists a profile' : 'no profile listed';
                } catch (e) {
                  outcome = e.message.split('\n')[0];
                }
                seen.push(outcome);
              }
              console.log(`session ${i + 1}: ${temps.map((t, j) => `${t}: ${seen[j]}`).join('; ')}`);
              if (seen.filter((s) => s === 'lists a profile').length !== 1) throw new Error(`session ${i + 1} must see the profile in its own account's temp folder only`);
              await p.close();
            }
            // run-server takes sessions at its secret path only. A client of the run-server port at "/" gets HTTP 400,
            // and so does a page with a localhost origin, which run-server's origin check lets through.
            const WebSocket = require(process.env.GITHUB_WORKSPACE + '\\gateway\\node_modules\\ws');
            const base = Number(process.env.BASE_PORT);
            for (const port of [base, base + 1]) {
              const status = await new Promise((done) => {
                const ws = new WebSocket(`ws://127.0.0.1:${port}/`, { headers: { 'x-playwright-browser': 'chromium' } });
                ws.on('unexpected-response', (req, res) => done(res.statusCode));
                ws.on('open', () => { ws.close(); done('open'); });
                ws.on('error', (e) => done(e.message));
              });
              if (status !== 400) throw new Error(`ws://127.0.0.1:${port}/: expected HTTP 400, got ${status}`);
              console.log(`ws://127.0.0.1:${port}/ refused with HTTP 400`);
            }
            await page.goto(`http://127.0.0.1:${base}/`).catch(() => {});
            const fromPage = await page.evaluate(async (ports) => Promise.all(ports.map((port) => new Promise((done) => {
              const ws = new window.WebSocket(`ws://127.0.0.1:${port}/`);
              ws.onopen = () => { ws.close(); done('open'); };
              ws.onerror = () => done('refused');
            }))), [base, base + 1]);
            if (fromPage.includes('open')) throw new Error(`a page opened a run-server session: ${fromPage}`);
            console.log(`a page at http://127.0.0.1:${base}/ opening ws://127.0.0.1:{${base},${base + 1}}/: ${fromPage.join(', ')}`);
          })().catch(e => { console.error(e); process.exit(1); });
          '@
          Set-Content -Path "$env:RUNNER_TEMP\client.js" -Value $client
          $env:BASE_PORT = (Get-Content "$env:INSTALL_DIR\backend.json" -Raw | ConvertFrom-Json).basePort
          node "$env:RUNNER_TEMP\client.js"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PWRUNNER status --install-dir $env:INSTALL_DIR
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: The service restarts a killed agent
        run: |
          $old = (Get-Content "$env:INSTALL_DIR\runtime.json" -Raw | ConvertFrom-Json).pid
          Stop-Process -Id $old -Force
          Start-Sleep -Seconds 1
          & $env:PWRUNNER status --install-dir $env:INSTALL_DIR --health-timeout 90
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:INSTALL_DIR\logs\service.log"; throw 'The agent did not come back' }
          $new = (Get-Content "$env:INSTALL_DIR\runtime.json" -Raw | ConvertFrom-Json).pid
          if ($new -eq $old) { throw "runtime.json still names the killed agent ($old)" }

      - name: Stopping the service stops the agent and reports degraded
        run: |
          Stop-Service PlaywrightBackend
          Start-Sleep -Seconds 5
          $left = @(Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" | Where-Object ExecutablePath -like "$env:INSTALL_DIR\runtime\*")
          if ($left.Count) { throw "Still running after Stop-Service: $($left.ProcessId -join ', ')" }
          if ((Invoke-RestMethod "$env:HUB_HTTP/api/nodes").nodes | Where-Object name -eq $env:CI_NODE) { throw 'Hub still lists the node' }
          & $env:PWRUNNER status --install-dir $env:INSTALL_DIR --json
          if ($LASTEXITCODE -ne 2) { throw "Expected exit code 2, got $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

      - name: Uninstall
        run: |
          & $env:PWRUNNER uninstall --install-dir $env:INSTALL_DIR --remove-files --yes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path $env:INSTALL_DIR) { throw 'Install dir still exists' }
          if (Get-Service PlaywrightBackend -ErrorAction SilentlyContinue) { throw 'Service still registered' }
          secedit /export /areas USER_RIGHTS /cfg "$env:RUNNER_TEMP\rights-after.inf" | Out-Null
          $accounts = $env:BROWSER_ACCOUNTS -split ','
          $sids = $env:BROWSER_SIDS -split ','
          for ($i = 0; $i -lt $accounts.Count; $i++) {
            $account, $sid = $accounts[$i], $sids[$i]
            if (Get-LocalUser -Name $account -ErrorAction SilentlyContinue) { throw "The browser account $account still exists" }
            if (Get-CimInstance Win32_UserProfile -Filter "SID = '$sid'") { throw "The profile of $account still exists" }
            if (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon\SpecialAccounts\UserList' -Name $account -ErrorAction SilentlyContinue) { throw "The sign-in screen entry of $account is still there" }
            if (Select-String -Path "$env:RUNNER_TEMP\rights-after.inf" -Pattern $sid -SimpleMatch -Quiet) { throw "User rights still name $sid ($account)" }
          }
          if (Get-LocalUser -Name 'pwb-*' -ErrorAction SilentlyContinue) { throw "Browser accounts left: $((Get-LocalUser -Name 'pwb-*').Name -join ', ')" }

      # upload-artifact needs one folder that holds every path, and the install and the hub's logs are on two drives.
      - name: Collect logs
        if: failure()
        run: |
          $dest = "$env:RUNNER_TEMP\backend-logs"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "$env:INSTALL_DIR\logs" $dest -Recurse -ErrorAction SilentlyContinue
          Copy-Item "$env:INSTALL_DIR\*.json", "$env:RUNNER_TEMP\hub*.log" $dest -ErrorAction SilentlyContinue
          exit 0

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-logs
          path: ${{ runner.temp }}\backend-logs
          if-no-files-found: ignore
